name: Finish report

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project id
        required: true
        type: string
      sampling_run:
        description: Sampling run id already materialized
        required: true
        type: string
      brand_probe_run:
        description: Source brand probe run id
        required: true
        type: string

permissions:
  contents: read

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Cancel the resumed job, then build the report with enough heap
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PROJECT_ID: ${{ github.event.inputs.project }}
          SAMPLING_RUN: ${{ github.event.inputs.sampling_run }}
          BRAND_RUN: ${{ github.event.inputs.brand_probe_run }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "PROJECT_ID='$PROJECT_ID' SAMPLING_RUN='$SAMPLING_RUN' BRAND_RUN='$BRAND_RUN' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /home/deploy/aeo
          env_value() { grep -E "^$1=" deploy/.env | tail -n1 | cut -d= -f2- | tr -d '\r'; }
          POSTGRES_USER="$(env_value POSTGRES_USER)"
          POSTGRES_DB="$(env_value POSTGRES_DB)"
          APP_IMAGE_VALUE="$(env_value APP_IMAGE)"
          IMAGE="${APP_IMAGE_VALUE:-ghcr.io/muadibusul/superaeo:latest}"
          : "${POSTGRES_USER:=aeo}"
          : "${POSTGRES_DB:=aeo}"

          COMPOSE=(docker compose -p aeo -f deploy/docker-compose.shared.yml)

          echo "== 0. Host memory and payload size (heap sizing)"
          awk '/MemTotal|MemAvailable/ {printf "%s %d MB\n", $1, $2/1024}' /proc/meminfo
          "${COMPOSE[@]}" exec -T postgres psql -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT id, pg_size_pretty(pg_column_size(node_json)::bigint) AS node_json_size, created_at
          FROM semantic_nebula_snapshots WHERE project_id = 'cmtzw2oc0003601p5m8xdu7r1' ORDER BY created_at DESC LIMIT 6;
          SQL

          echo "== 1. Cancel any resumed job and stop it from ever running again"
          JOB_IDS=$("${COMPOSE[@]}" exec -T postgres psql -tA -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT queue_job_id FROM analysis_jobs WHERE status IN ('queued','running','retrying') AND queue_job_id IS NOT NULL")
          for jid in $JOB_IDS; do
            jid="$(printf '%s' "$jid" | tr -d '\r')"
            [ -n "$jid" ] || continue
            echo "  cancelling job $jid"
            for q in semantic.intelligence sampling.run response.analyze entity.graph.build report.generate; do
              for list in wait active delayed failed prioritized paused; do
                "${COMPOSE[@]}" exec -T redis redis-cli LREM "bull:$q:$list" 0 "$jid" >/dev/null
              done
              for key in $("${COMPOSE[@]}" exec -T redis redis-cli --raw KEYS "bull:$q:$jid*" 2>/dev/null | tr -d '\r'); do
                [ -n "$key" ] || continue
                "${COMPOSE[@]}" exec -T redis redis-cli DEL "$key" >/dev/null
              done
            done
          done
          "${COMPOSE[@]}" exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          UPDATE analysis_jobs SET status = 'failed', completed_at = now(),
                 error = 'Cancelled by operator: sampling stopped on request. Trace ID: ' || trace_id
          WHERE status IN ('queued','running','retrying');
          UPDATE brand_probe_runs SET status = 'failed', current_stage = 'MANUAL_CANCEL', finished_at = now(),
                 error_message = 'Cancelled by operator: sampling stopped on request.'
          WHERE status IN ('queued','running');
          COMMIT;
          SQL
          "${COMPOSE[@]}" stop worker
          echo "  worker stopped"

          echo "== 2. Report-only continuation script"
          cat > /tmp/continue-report.ts <<'TSEOF'
          import "dotenv/config";
          import type { Prisma } from "@/generated/prisma/client";
          import { getPrisma } from "@/server/db";
          import { buildReportSnapshot } from "@/server/report/report-snapshot";
          import { createReportEvidence } from "@/server/evidence/evidence-service";
          import { ensurePrimaryProjectSubject } from "@/server/projects/subject-service";
          import { getAuditUsageSummary } from "@/server/ai/usage-summary";

          function asRecord(value: unknown): Record<string, unknown> {
            return value && typeof value === "object" && !Array.isArray(value) ? (value as Record<string, unknown>) : {};
          }
          function escapeHtml(value: string) {
            return value.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
          }
          function renderReportHtml(title: string, summary: string) {
            return [
              `<article class="cip-report">`,
              `<h1>${escapeHtml(title)}</h1>`,
              `<p>${escapeHtml(summary)}</p>`,
              `<p>Scores and recommendations in this report are backed by sampled AI answers and traceable evidence.</p>`,
              `</article>`,
            ].join("");
          }
          function headlineFromSnapshot(snapshot: unknown, subjectName: string) {
            const briefs = asRecord(asRecord(snapshot).briefs);
            const en = asRecord(briefs.en);
            const summary = asRecord(en.summary);
            return typeof summary.headline === "string" ? summary.headline : `${subjectName} AI cognition report is ready.`;
          }

          async function main() {
            const [projectId, samplingRunId, brandProbeRunId] = process.argv.slice(2);
            if (!projectId || !samplingRunId || !brandProbeRunId) throw new Error("usage: continue-report.ts <projectId> <samplingRunId> <brandProbeRunId>");
            const prisma = getPrisma();

            const project = await prisma.project.findUnique({ where: { id: projectId }, include: { competitors: true } });
            if (!project) throw new Error(`Project not found: ${projectId}`);
            const subject = await ensurePrimaryProjectSubject(project);

            const nebulaSnapshots = await prisma.semanticNebulaSnapshot.findMany({ where: { projectId }, orderBy: { createdAt: "desc" }, take: 6, select: { id: true, createdAt: true } });
            const opportunitySnapshot = await prisma.longTailOpportunitySnapshot.findFirst({ where: { projectId }, orderBy: { createdAt: "desc" }, select: { id: true } });
            const territorySnapshot = await prisma.questionTerritorySnapshot.findFirst({ where: { projectId }, orderBy: { createdAt: "desc" }, select: { id: true } });

            const title = `${subject.displayName} AI Cognition Audit`;
            const snapshot = await buildReportSnapshot({ projectId, subjectId: subject.id, subjectName: subject.displayName });
            console.log(JSON.stringify({ step: "snapshot_built" }));
            const report = await prisma.report.create({
              data: {
                projectId,
                runId: samplingRunId,
                title,
                format: "html",
                status: "ready",
                snapshot,
                html: renderReportHtml(title, headlineFromSnapshot(snapshot, subject.displayName)),
              },
            });
            await createReportEvidence(report.id);
            console.log(JSON.stringify({ step: "report", reportId: report.id, title: report.title }));

            const job = await prisma.analysisJob.findFirst({ where: { projectId, jobType: "full_diagnosis" }, orderBy: { createdAt: "desc" } });
            if (job) {
              const usageSummary = await getAuditUsageSummary(projectId, job.traceId).catch(() => null);
              const previous = asRecord(job.result);
              const history = Array.isArray(previous.stageHistory) ? previous.stageHistory : [];
              const at = new Date().toISOString();
              const stages = [
                ["DIAGNOSIS_MAPPING_SEMANTIC_FIELD", "Mapping the entity semantic field directly from structured units, relations, clusters, and evidence."],
                ["DIAGNOSIS_FINDING_OPPORTUNITIES", "Finding long-tail answer spaces and building question territory."],
                ["DIAGNOSIS_BUILDING_EVIDENCE_REPORT", "Building a concise evidence-backed AI cognition audit."],
              ] as const;
              const result = {
                ...previous,
                currentStage: "DIAGNOSIS_BUILDING_EVIDENCE_REPORT",
                stageMessage: "Building a concise evidence-backed AI cognition audit.",
                stageHistory: [...history, ...stages.map(([stage, message]) => ({ at, stage, message }))],
                output: {
                  projectId,
                  subjectId: subject.id,
                  runId: samplingRunId,
                  brandProbeRunId,
                  reportId: report.id,
                  semanticNebulaSnapshotIds: nebulaSnapshots.map((item) => item.id),
                  opportunitySnapshotId: opportunitySnapshot?.id ?? null,
                  territorySnapshotId: territorySnapshot?.id ?? null,
                  usageSummary,
                  completedFromExistingExploration: true,
                },
              };
              await prisma.analysisJob.update({ where: { id: job.id }, data: { status: "completed", completedAt: new Date(), error: null, result: result as Prisma.InputJsonValue } });
              console.log(JSON.stringify({ step: "job_completed", analysisJobId: job.id, traceId: job.traceId }));
            }
            console.log(JSON.stringify({ step: "done", projectId, reportId: report.id }));
          }

          main()
            .then(async () => { await getPrisma().$disconnect(); })
            .catch(async (error) => { console.error(error); await getPrisma().$disconnect(); process.exit(1); });
          TSEOF

          echo "== 3. Running report build in a one-off container with a larger heap"
          FREE_MB=$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo)
          if [ "$FREE_MB" -ge 5000 ]; then HEAP=3584; LIMIT=4g;
          elif [ "$FREE_MB" -ge 3000 ]; then HEAP=2048; LIMIT=2560m;
          else HEAP=1280; LIMIT=1536m; fi
          echo "  MemAvailable=${FREE_MB}MB -> heap=${HEAP}MB limit=${LIMIT}"
          docker run --rm --network aeo_internal --memory "$LIMIT" \
            -e NODE_OPTIONS="--max-old-space-size=$HEAP" \
            --env-file deploy/.env \
            -v /tmp/continue-report.ts:/app/scripts/continue-report.ts:ro \
            "$IMAGE" npx tsx scripts/continue-report.ts "$PROJECT_ID" "$SAMPLING_RUN" "$BRAND_RUN"

          echo "== 4. Verification"
          "${COMPOSE[@]}" exec -T postgres psql -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -v pid="$PROJECT_ID" <<'SQL'
          SELECT id, title, status, created_at FROM reports WHERE project_id = :'pid' ORDER BY created_at DESC LIMIT 3;
          SELECT count(*) AS active_jobs FROM analysis_jobs WHERE status IN ('queued','running','retrying');
          SELECT count(*) AS calls_last_3min, coalesce(sum(total_tokens),0) AS tokens_last_3min FROM ai_usage_logs WHERE created_at > now() - interval '3 minutes';
          SQL
          "${COMPOSE[@]}" ps --format 'table {{.Service}}\t{{.Status}}'
          REMOTE
