name: Inspect failures

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload the inspection script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'cat > /tmp/inspect-failures.sh && chmod +x /tmp/inspect-failures.sh' <<'SCRIPT'
          #!/usr/bin/env bash
          set -uo pipefail
          cd /home/deploy/aeo
          env_value() { grep -E "^$1=" deploy/.env | tail -n1 | cut -d= -f2- | tr -d '\r' || true; }
          POSTGRES_USER="$(env_value POSTGRES_USER)"; POSTGRES_USER="${POSTGRES_USER:-aeo}"
          POSTGRES_DB="$(env_value POSTGRES_DB)"; POSTGRES_DB="${POSTGRES_DB:-aeo}"
          PSQL=(timeout 30 docker compose -p aeo -f deploy/docker-compose.shared.yml exec -T postgres psql -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1)

          echo "== warn/error event mix on the trace"
          "${PSQL[@]}" <<'SQL'
          SELECT event_type, count(*) AS events
          FROM trace_events
          WHERE trace_id = '0cdbd5c1-3898-46b8-a1b1-b8a69590b5a5' AND severity IN ('warn','error')
          GROUP BY event_type ORDER BY events DESC;
          SQL

          echo "== failed AI calls by error text"
          "${PSQL[@]}" <<'SQL'
          SELECT left(error, 130) AS error_text, count(*) AS calls
          FROM ai_usage_logs
          WHERE trace_id = '0cdbd5c1-3898-46b8-a1b1-b8a69590b5a5' AND status = 'failed'
          GROUP BY 1 ORDER BY calls DESC LIMIT 10;
          SQL

          echo "== prompt runs: initial vs repair outcomes"
          "${PSQL[@]}" <<'SQL'
          SELECT CASE WHEN prompt_name LIKE '%\_repair' THEN 'repair' ELSE 'initial' END AS phase,
                 status, count(*) AS runs
          FROM prompt_runs
          WHERE trace_id = '0cdbd5c1-3898-46b8-a1b1-b8a69590b5a5'
          GROUP BY 1, 2 ORDER BY 1, 2;
          SQL

          echo "== probe-level failures"
          "${PSQL[@]}" <<'SQL'
          SELECT left(error_message, 150) AS error_text, count(*) AS probes
          FROM brand_probe_responses
          WHERE run_id = 'cmtzw3fgd00160wo64mkxjbal' AND error_message IS NOT NULL
          GROUP BY 1 ORDER BY probes DESC LIMIT 10;
          SQL

          echo "== validation error shape (zod issue paths)"
          "${PSQL[@]}" <<'SQL'
          SELECT left(error, 400) AS error_text
          FROM prompt_runs
          WHERE trace_id = '0cdbd5c1-3898-46b8-a1b1-b8a69590b5a5' AND status = 'failed'
          ORDER BY created_at DESC LIMIT 4;
          SQL
          SCRIPT

      - name: Run the inspection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash /tmp/inspect-failures.sh' </dev/null
