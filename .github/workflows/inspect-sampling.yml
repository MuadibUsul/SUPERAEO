name: Inspect sampling state

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Inspect production sampling state
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s" <<'REMOTE'
          set -euo pipefail
          cd /home/deploy/aeo
          env_value() { grep -E "^$1=" deploy/.env | tail -n1 | cut -d= -f2- | tr -d '\r'; }
          POSTGRES_USER="$(env_value POSTGRES_USER)"
          POSTGRES_DB="$(env_value POSTGRES_DB)"
          : "${POSTGRES_USER:=aeo}"
          : "${POSTGRES_DB:=aeo}"

          COMPOSE=(docker compose -p aeo -f deploy/docker-compose.shared.yml)

          echo "== analysis jobs for project cmtzw2oc0003601p5m8xdu7r1 (last 2h)"
          "${COMPOSE[@]}" exec -T postgres psql -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT id, job_type, status, attempts, created_at, started_at, completed_at, trace_id, left(error, 200) AS error
          FROM analysis_jobs
          WHERE project_id = 'cmtzw2oc0003601p5m8xdu7r1' AND created_at > now() - interval '2 hours'
          ORDER BY created_at DESC LIMIT 10;
          SQL

          echo "== brand probe runs with analysis_job_id (last 2h)"
          "${COMPOSE[@]}" exec -T postgres psql -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT id, analysis_job_id, status, mode, total_probes, completed_probes, failed_probes, current_stage, created_at, started_at, finished_at
          FROM brand_probe_runs
          WHERE created_at > now() - interval '2 hours'
          ORDER BY created_at DESC LIMIT 10;
          SQL

          echo "== running job stage"
          "${COMPOSE[@]}" exec -T postgres psql -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT id, status, attempts, started_at, result->>'currentStage' AS stage, result->>'stageMessage' AS message, result->'stageHistory' AS history
          FROM analysis_jobs WHERE status = 'running';
          SQL

          echo "== trace events around the transition (diagnosis trace, last 40)"
          "${COMPOSE[@]}" exec -T postgres psql -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT created_at, event_type, subsystem, operation, status, left(message, 120) AS message, left(error_message, 200) AS error_message, left(metadata_json::text, 200) AS metadata
          FROM trace_events
          WHERE trace_id = '0cdbd5c1-3898-46b8-a1b1-b8a69590b5a5'
          ORDER BY created_at DESC LIMIT 40;
          SQL

          echo "== trace events for second probe run (brand_probe_run trace)"
          "${COMPOSE[@]}" exec -T postgres psql -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT created_at, event_type, subsystem, operation, status, left(message, 120) AS message, left(metadata_json::text, 160) AS metadata
          FROM trace_events
          WHERE trace_id = 'brand_probe_run:cmtzwqtei00030vo60927kzkg'
          ORDER BY created_at LIMIT 15;
          SQL
          REMOTE
