name: Inspect sampling state

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Inspect production sampling state
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s" <<'REMOTE'
          set -euo pipefail
          cd /home/deploy/aeo
          env_value() { grep -E "^$1=" deploy/.env | tail -n1 | cut -d= -f2- | tr -d '\r'; }
          POSTGRES_USER="$(env_value POSTGRES_USER)"
          POSTGRES_DB="$(env_value POSTGRES_DB)"
          : "${POSTGRES_USER:=aeo}"
          : "${POSTGRES_DB:=aeo}"

          COMPOSE=(docker compose -p aeo -f deploy/docker-compose.shared.yml)

          echo "== running analysis job"
          "${COMPOSE[@]}" exec -T postgres psql -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT id, job_type, status, started_at, attempts, result
          FROM analysis_jobs WHERE status = 'running' ORDER BY started_at DESC LIMIT 3;
          SQL

          echo "== recent brand_probe_runs"
          "${COMPOSE[@]}" exec -T postgres psql -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT id, project_id, status, mode, total_probes, completed_probes, failed_probes, current_stage, started_at, finished_at, created_at
          FROM brand_probe_runs ORDER BY created_at DESC LIMIT 5;
          SQL

          echo "== brand_probe_responses accounting of latest run"
          "${COMPOSE[@]}" exec -T postgres psql -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT run_id, count(*) AS rows, count(total_tokens) AS with_tokens, count(cost_estimate) AS with_cost,
                 coalesce(sum(total_tokens),0) AS sum_tokens, coalesce(sum(cost_estimate),0) AS sum_cost,
                 count(*) FILTER (WHERE error_message IS NOT NULL) AS with_error, max(created_at) AS last
          FROM brand_probe_responses
          WHERE run_id = (SELECT id FROM brand_probe_runs ORDER BY created_at DESC LIMIT 1)
          GROUP BY run_id;
          SQL

          echo "== latest run semantic exploration config"
          "${COMPOSE[@]}" exec -T postgres psql -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT config_json->'semanticExploration' AS exploration
          FROM brand_probe_runs ORDER BY created_at DESC LIMIT 1;
          SQL

          echo "== semantic coverage snapshots (latest run)"
          "${COMPOSE[@]}" exec -T postgres psql -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT created_at, evidence->'exploration' AS exploration
          FROM semantic_coverage_snapshots ORDER BY created_at DESC LIMIT 3;
          SQL
          REMOTE
