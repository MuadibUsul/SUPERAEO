name: Inspect token spend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload the inspection script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'cat > /tmp/inspect-spend.sh && chmod +x /tmp/inspect-spend.sh' <<'SCRIPT'
          #!/usr/bin/env bash
          set -uo pipefail
          cd /home/deploy/aeo
          env_value() { grep -E "^$1=" deploy/.env | tail -n1 | cut -d= -f2- | tr -d '\r' || true; }
          POSTGRES_USER="$(env_value POSTGRES_USER)"; POSTGRES_USER="${POSTGRES_USER:-aeo}"
          POSTGRES_DB="$(env_value POSTGRES_DB)"; POSTGRES_DB="${POSTGRES_DB:-aeo}"
          PSQL=(timeout 30 docker compose -p aeo -f deploy/docker-compose.shared.yml exec -T postgres psql -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1)

          echo "== token spend by operation (trace 0cdbd5c1, the 4.4M run)"
          "${PSQL[@]}" <<'SQL'
          SELECT operation, count(*) AS calls,
                 sum(coalesce(prompt_tokens,0)) AS prompt_tokens,
                 sum(coalesce(completion_tokens,0)) AS completion_tokens,
                 sum(coalesce(total_tokens,0)) AS total_tokens,
                 round(avg(coalesce(total_tokens,0))) AS avg_per_call,
                 max(coalesce(total_tokens,0)) AS max_per_call
          FROM ai_usage_logs WHERE trace_id = '0cdbd5c1-3898-46b8-a1b1-b8a69590b5a5'
          GROUP BY operation ORDER BY total_tokens DESC;
          SQL

          echo "== spend by phase"
          "${PSQL[@]}" <<'SQL'
          SELECT CASE WHEN created_at < timestamp '2026-09-13 14:26:00' THEN 'A: first 360-probe run' ELSE 'B: retry (cancelled)' END AS phase,
                 count(*) AS calls, sum(coalesce(prompt_tokens,0)) AS prompt_tokens,
                 sum(coalesce(completion_tokens,0)) AS completion_tokens,
                 sum(coalesce(total_tokens,0)) AS total_tokens
          FROM ai_usage_logs WHERE trace_id = '0cdbd5c1-3898-46b8-a1b1-b8a69590b5a5'
          GROUP BY 1 ORDER BY 1;
          SQL

          echo "== budget configuration in production"
          "${PSQL[@]}" <<'SQL'
          SELECT name, enabled, default_model, monthly_budget, rate_limit_per_minute FROM ai_providers ORDER BY created_at;
          SELECT slug, plan, quota_overrides FROM organizations ORDER BY created_at;
          SQL
          echo "== tuning knobs present in deploy/.env"
          grep -E '^(SEMANTIC_EXPLORATION|PROBE_|REQUIRE_AI_PROVIDER_BUDGET|HOME_FEATURED)' deploy/.env || echo "(no overrides; built-in defaults apply)"

          echo "== probe zones in run #1"
          "${PSQL[@]}" <<'SQL'
          SELECT zone, count(*) AS probes,
                 count(*) FILTER (WHERE status = 'completed') AS completed,
                 count(*) FILTER (WHERE status = 'failed') AS failed
          FROM brand_probes WHERE run_id = 'cmtzw3fgd00160wo64mkxjbal'
          GROUP BY zone ORDER BY probes DESC;
          SQL

          echo "== run settings"
          "${PSQL[@]}" <<'SQL'
          SELECT mode, execution_mode, micro_batch_size, max_concurrency, request_rate_limit, target_throughput_per_minute,
                 tokens_per_minute_budget, total_probes, completed_probes, failed_probes
          FROM brand_probe_runs WHERE id = 'cmtzw3fgd00160wo64mkxjbal';
          SQL

          echo "== response accounting (per probe tokens)"
          "${PSQL[@]}" <<'SQL'
          SELECT count(*) AS responses,
                 round(avg(coalesce(total_tokens,0))) AS avg_tokens_per_response,
                 sum(coalesce(input_tokens,0)) AS input_tokens,
                 sum(coalesce(output_tokens,0)) AS output_tokens,
                 sum(coalesce(reasoning_tokens,0)) AS reasoning_tokens,
                 count(*) FILTER (WHERE retry_count > 0) AS responses_with_retry,
                 max(retry_count) AS max_retry
          FROM brand_probe_responses WHERE run_id = 'cmtzw3fgd00160wo64mkxjbal';
          SQL
          SCRIPT

      - name: Run the inspection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash /tmp/inspect-spend.sh' </dev/null
