name: Inspect trace events

on:
  workflow_dispatch:
    inputs:
      trace:
        description: Trace id
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload the inspection script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'cat > /tmp/inspect-trace.sh && chmod +x /tmp/inspect-trace.sh' <<'SCRIPT'
          #!/usr/bin/env bash
          set -uo pipefail
          cd /home/deploy/aeo
          : "${TRACE_ID:?}"
          env_value() { grep -E "^$1=" deploy/.env | tail -n1 | cut -d= -f2- | tr -d '\r' || true; }
          POSTGRES_USER="$(env_value POSTGRES_USER)"; POSTGRES_USER="${POSTGRES_USER:-aeo}"
          POSTGRES_DB="$(env_value POSTGRES_DB)"; POSTGRES_DB="${POSTGRES_DB:-aeo}"
          COMPOSE=(docker compose -p aeo -f deploy/docker-compose.shared.yml)
          PSQL=(timeout 30 "${COMPOSE[@]}" exec -T postgres psql -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -v trace="$TRACE_ID")

          echo "== job"
          "${PSQL[@]}" <<'SQL'
          SELECT id, job_type, status, attempts, created_at, started_at, completed_at, left(error, 300) AS error
          FROM analysis_jobs WHERE trace_id = :'trace';
          SQL

          echo "== trace events"
          "${PSQL[@]}" <<'SQL'
          SELECT to_char(created_at, 'HH24:MI:SS.MS') AS at, severity, event_type, subsystem, operation, status,
                 left(error_code, 40) AS code, left(error_message, 500) AS message, left(metadata_json::text, 500) AS meta
          FROM trace_events WHERE trace_id = :'trace' ORDER BY created_at;
          SQL

          echo "== ai usage"
          "${PSQL[@]}" <<'SQL'
          SELECT to_char(created_at, 'HH24:MI:SS') AS at, provider_id, model_id, operation, status,
                 prompt_tokens, completion_tokens, total_tokens, latency_ms, left(error, 400) AS error
          FROM ai_usage_logs WHERE trace_id = :'trace' ORDER BY created_at;
          SQL

          echo "== providers"
          "${PSQL[@]}" <<'SQL'
          SELECT name, provider_type, enabled, default_model, base_url,
                 (api_key_encrypted IS NOT NULL AND api_key_encrypted <> '') AS has_key
          FROM ai_providers ORDER BY created_at;
          SQL

          echo "== provider call timeline (last 40 calls)"
          "${PSQL[@]}" <<'SQL'
          SELECT to_char(created_at, 'HH24:MI:SS') AS at, status, count(*) AS calls, coalesce(sum(total_tokens),0) AS tokens
          FROM ai_usage_logs
          WHERE provider_id = 'cmtzvtl0z002r01p5jio0v7vf' AND created_at > now() - interval '3 hours'
          GROUP BY 1, 2 ORDER BY 1 DESC LIMIT 40;
          SQL

          echo "== provider success/failure boundary"
          "${PSQL[@]}" <<'SQL'
          SELECT
            (SELECT to_char(max(created_at), 'YYYY-MM-DD HH24:MI:SS') FROM ai_usage_logs WHERE provider_id = 'cmtzvtl0z002r01p5jio0v7vf' AND status = 'success') AS last_success,
            (SELECT to_char(min(created_at), 'YYYY-MM-DD HH24:MI:SS') FROM ai_usage_logs WHERE provider_id = 'cmtzvtl0z002r01p5jio0v7vf' AND status = 'failed' AND error ILIKE '%Authentication Fails%') AS first_auth_failure;
          SQL
          SCRIPT

      - name: Run the inspection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TRACE_ID: ${{ github.event.inputs.trace }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "TRACE_ID='$TRACE_ID' bash /tmp/inspect-trace.sh" </dev/null
