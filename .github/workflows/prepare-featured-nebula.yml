name: Prepare featured nebula

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project id to pin as the homepage semantic field
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Pin the homepage project in deploy/.env
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PROJECT_ID: ${{ github.event.inputs.project }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "PROJECT_ID='$PROJECT_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /home/deploy/aeo
          cp deploy/.env "deploy/.env.bak-$(date +%Y%m%d-%H%M%S)"
          grep -v '^HOME_FEATURED_PROJECT_ID=' deploy/.env > /tmp/env.new || true
          printf 'HOME_FEATURED_PROJECT_ID=%s\n' "$PROJECT_ID" >> /tmp/env.new
          cat /tmp/env.new > deploy/.env
          rm -f /tmp/env.new
          echo "== HOME_* entries in deploy/.env:"
          grep -E '^HOME_' deploy/.env
          echo "== backups:"
          ls -1 deploy/ | grep '^\.env.bak' | tail -3
          REMOTE
