name: Stop sampling now

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Stop the worker and cancel in-flight sampling
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s" <<'REMOTE'
          set -euo pipefail
          cd /home/deploy/aeo
          env_value() { grep -E "^$1=" deploy/.env | tail -n1 | cut -d= -f2- | tr -d '\r'; }
          POSTGRES_USER="$(env_value POSTGRES_USER)"
          POSTGRES_DB="$(env_value POSTGRES_DB)"
          : "${POSTGRES_USER:=aeo}"
          : "${POSTGRES_DB:=aeo}"

          COMPOSE=(docker compose -p aeo -f deploy/docker-compose.shared.yml)

          echo "== 1. Stopping worker container (halts all AI calls immediately)"
          "${COMPOSE[@]}" stop worker

          echo "== 2. State before cleanup"
          "${COMPOSE[@]}" exec -T postgres psql -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT id, job_type, status, queue_name, queue_job_id, attempts, started_at
          FROM analysis_jobs WHERE status IN ('queued','running','retrying') ORDER BY created_at;
          SELECT id, status, current_stage, completed_probes, failed_probes FROM brand_probe_runs WHERE status IN ('queued','running');
          SQL

          echo "== 3. Removing queued/running BullMQ jobs so they cannot resume"
          JOB_IDS=$("${COMPOSE[@]}" exec -T postgres psql -tA -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT queue_job_id FROM analysis_jobs WHERE status IN ('queued','running','retrying') AND queue_job_id IS NOT NULL")
          for jid in $JOB_IDS; do
            jid="$(printf '%s' "$jid" | tr -d '\r')"
            [ -n "$jid" ] || continue
            echo "  removing job $jid"
            for q in semantic.intelligence sampling.run response.analyze entity.graph.build report.generate; do
              for list in wait active delayed failed prioritized paused; do
                "${COMPOSE[@]}" exec -T redis redis-cli LREM "bull:$q:$list" 0 "$jid" >/dev/null
              done
              for key in $("${COMPOSE[@]}" exec -T redis redis-cli --raw KEYS "bull:$q:$jid*" 2>/dev/null); do
                key="$(printf '%s' "$key" | tr -d '\r')"
                [ -n "$key" ] || continue
                "${COMPOSE[@]}" exec -T redis redis-cli DEL "$key" >/dev/null
              done
            done
          done

          echo "== 4. Marking cancelled jobs in the database"
          "${COMPOSE[@]}" exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          UPDATE analysis_jobs
          SET status = 'failed', completed_at = now(),
              error = 'Cancelled by operator: sampling stopped on request. Trace ID: ' || trace_id
          WHERE status IN ('queued','running','retrying');
          UPDATE brand_probe_runs
          SET status = 'failed', current_stage = 'MANUAL_CANCEL', finished_at = now(),
              error_message = 'Cancelled by operator: sampling stopped on request.'
          WHERE status IN ('queued','running');
          COMMIT;
          SQL

          echo "== 5. Restarting worker so the platform keeps serving other work"
          "${COMPOSE[@]}" start worker
          sleep 12

          echo "== 6. Verification: no active jobs, queue depths"
          "${COMPOSE[@]}" exec -T postgres psql -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT count(*) AS active_job_count FROM analysis_jobs WHERE status IN ('queued','running','retrying');
          SELECT id, status, current_stage, completed_probes, failed_probes FROM brand_probe_runs ORDER BY created_at DESC LIMIT 3;
          SQL
          for q in semantic.intelligence sampling.run; do
            for st in wait active; do
              printf '%s %-7s ' "$q" "$st"
              "${COMPOSE[@]}" exec -T redis redis-cli LLEN "bull:$q:$st"
            done
          done

          echo "== 7. Worker logs (tail 15)"
          "${COMPOSE[@]}" logs --tail 15 --timestamps worker 2>&1 | tail -15
          REMOTE
