name: Verify state

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Report container and queue state
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'cat > /tmp/verify-state.sh && chmod +x /tmp/verify-state.sh' <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          cd /home/deploy/aeo
          env_value() { grep -E "^$1=" deploy/.env | tail -n1 | cut -d= -f2- | tr -d '\r' || true; }
          POSTGRES_USER="$(env_value POSTGRES_USER)"; POSTGRES_USER="${POSTGRES_USER:-aeo}"
          POSTGRES_DB="$(env_value POSTGRES_DB)"; POSTGRES_DB="${POSTGRES_DB:-aeo}"
          COMPOSE=(docker compose -p aeo -f deploy/docker-compose.shared.yml)

          echo "== containers"
          "${COMPOSE[@]}" ps --format 'table {{.Service}}\t{{.Status}}' </dev/null
          echo "== worker detail"
          docker ps -a --filter "name=aeo-worker" --format '{{.Names}} | {{.Status}}' </dev/null
          echo "== homepage still serves the featured field"
          "${COMPOSE[@]}" exec -T web node -e "fetch('http://127.0.0.1:3000/zh-CN').then(async (r) => { const t = await r.text(); console.log('status', r.status, 'elon', /Elon Musk/.test(t) ? 'PRESENT' : 'MISSING', 'demoBadge', /演示数据/.test(t) ? 'PRESENT' : 'ABSENT'); }).catch((e) => { console.error(e); process.exit(1); });" </dev/null
          echo "== jobs and burn"
          "${COMPOSE[@]}" exec -T postgres psql -P pager=off -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT count(*) AS active_jobs FROM analysis_jobs WHERE status IN ('queued','running','retrying');
          SELECT count(*) AS calls_last_10min, coalesce(sum(total_tokens),0) AS tokens_last_10min FROM ai_usage_logs WHERE created_at > now() - interval '10 minutes';
          SQL
          SCRIPT

      - name: Run the verification
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash /tmp/verify-state.sh' </dev/null
