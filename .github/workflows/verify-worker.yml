name: Verify worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload the verification script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'cat > /tmp/verify-worker.sh && chmod +x /tmp/verify-worker.sh' <<'SCRIPT'
          #!/usr/bin/env bash
          set -uo pipefail
          cd /home/deploy/aeo
          COMPOSE=(docker compose -p aeo -f deploy/docker-compose.shared.yml)

          echo "== worker container"
          timeout 20 docker ps --filter "name=aeo-worker" --format '{{.Names}} | {{.Status}}' </dev/null

          echo "== worker memory limit (bytes) and heap flag"
          timeout 20 docker inspect --format 'limit_bytes={{.HostConfig.Memory}}' aeo-worker-1 </dev/null
          timeout 20 docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' aeo-worker-1 </dev/null | grep -E "NODE_OPTIONS" || echo "NODE_OPTIONS: (none)"

          echo "== heartbeat the audit gate reads (cip:worker:heartbeat)"
          timeout 20 "${COMPOSE[@]}" exec -T redis redis-cli --raw GET cip:worker:heartbeat </dev/null
          echo "== heartbeat TTL seconds (30 = fresh)"
          timeout 20 "${COMPOSE[@]}" exec -T redis redis-cli --raw TTL cip:worker:heartbeat </dev/null

          echo "== worker log tail"
          timeout 25 "${COMPOSE[@]}" logs --tail 6 --timestamps worker </dev/null 2>&1 | tail -6
          SCRIPT

      - name: Run the verification
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash /tmp/verify-worker.sh' </dev/null
