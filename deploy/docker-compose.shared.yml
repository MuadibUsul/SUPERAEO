# Production stack for the shared VPS. The host's existing Caddy container
# owns ports 80/443 and reaches aeo-app through the external `web` network.
name: aeo

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    networks: [internal]
    mem_limit: 512m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    networks: [internal]
    mem_limit: 128m
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  object-storage:
    image: rustfs/rustfs@sha256:97171b3d72cd47dc81000f92ea84de25608bfc35a94c965501afaeb5d99f6035
    restart: unless-stopped
    env_file: .env
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
    networks: [internal]
    mem_limit: 256m
    volumes:
      - objectdata:/data
    healthcheck:
      test: ["CMD", "sh", "-ec", "curl -fsS http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

  object-storage-init:
    image: ${APP_IMAGE:-ghcr.io/muadibusul/superaeo:latest}
    env_file: .env
    networks: [internal]
    command: ["npm", "run", "object-storage:init"]
    depends_on:
      object-storage:
        condition: service_healthy
    restart: "no"
    mem_limit: 512m
    logging: *default-logging

  migrate:
    image: ${APP_IMAGE:-ghcr.io/muadibusul/superaeo:latest}
    env_file: .env
    networks: [internal]
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 768m
    logging: *default-logging

  web:
    image: ${APP_IMAGE:-ghcr.io/muadibusul/superaeo:latest}
    container_name: aeo-app
    env_file: .env
    networks: [internal, web]
    mem_limit: 1g
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

  worker:
    image: ${APP_IMAGE:-ghcr.io/muadibusul/superaeo:latest}
    env_file: .env
    networks: [internal]
    command: ["npm", "run", "worker"]
    healthcheck:
      disable: true
    # The post-sampling stages (the report snapshot in particular) parse large
    # JSON aggregates. At the previous 768m the heap hit its ceiling and the
    # process died mid-audit; BullMQ answered with a stalled re-delivery, and a
    # retry re-runs the whole diagnosis — sampling included (2026-09-13).
    environment:
      NODE_OPTIONS: "--max-old-space-size=2048"
    mem_limit: 2560m
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

networks:
  internal:
    name: aeo_internal
  web:
    external: true
    name: web

volumes:
  pgdata:
  redisdata:
  objectdata:
